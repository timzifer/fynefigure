name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fyne's desktop driver is cgo and needs the X11 and GL headers. The tests
  # themselves need no display: Fyne's test driver paints in software.
  FYNE_DEPS: libgl1-mesa-dev xorg-dev libxkbcommon-dev

jobs:
  check:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # "stable" rather than the version in go.mod, which names the minimum
      # the module supports and not the toolchain to test on. Pinning to that
      # minimum means testing on a release whose standard library has known
      # vulnerabilities the day a patch lands; govulncheck below reports them,
      # and reporting a stale toolchain to yourself is not the point.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            cmd/demo/go.sum

      - name: install the Fyne build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $FYNE_DEPS

      - name: gofmt
        run: |
          # Must print nothing. A file listed here is a file gofmt would change.
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: |
          go vet ./...
          (cd cmd/demo && go vet ./...)

      - name: build
        run: |
          go build ./...
          (cd cmd/demo && go build ./...)

      - name: test
        run: |
          go test ./...
          (cd cmd/demo && go test ./...)

      - name: test with the race detector
        run: |
          go test -race ./...
          (cd cmd/demo && go test -race ./...)

  nocgo:
    name: the library builds without cgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # The widget and its render target are pure Go. Only the demo needs cgo,
      # because Fyne's desktop driver does — so this pins that the packages a
      # library consumer imports do not.
      - name: build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build . ./chart ./orbit

  minimum:
    name: builds on the Go version go.mod names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The other jobs test the toolchain people will actually run. This
          # one holds the module to the version it claims to need, so that the
          # go directive is a promise rather than a guess.
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/demo/go.sum
      - run: |
          sudo apt-get update
          sudo apt-get install -y $FYNE_DEPS
      - run: |
          go build ./...
          (cd cmd/demo && go build ./...)

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            cmd/demo/go.sum
      - run: |
          sudo apt-get update
          sudo apt-get install -y $FYNE_DEPS

      # govulncheck reports what an advisory means here rather than that one
      # exists: it follows the call graph and names the vulnerabilities this
      # code can actually reach. That is the question a version bump cannot
      # answer, and the reason this repository does not take routine ones.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          (cd cmd/demo && go run golang.org/x/vuln/cmd/govulncheck@latest ./...)

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            cmd/demo/go.sum

      - name: tidy
        run: |
          go mod tidy
          (cd cmd/demo && go mod tidy)
          git diff --exit-code -- go.mod go.sum cmd/demo/go.mod cmd/demo/go.sum
